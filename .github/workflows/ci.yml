name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run check

  # A disposable site's Cloudflare CI image, built with Docker: the install
  # step's Composer command as root on a clean CMS, with installer plugins
  # and the dependency patch. Public packages only; no secrets.
  ci-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/ci-composer.sh

  # A disposable site generated by this checkout's gq new: its Frontend's
  # rendered-route tests, astro check, lint and format, against the pinned
  # @getquick/content it installs.
  generated-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/frontend-check.sh

  # A generated site wired to the content package pair (ADR 0020): its pins,
  # the CMS plugin's crontab command and identity (its published ZIP), the
  # migrations the deploy resolves, and its Frontend built by Alchemy's Astro
  # Cloudflare build, served in workerd with a local D1 store, through its
  # /gq routes. No account.
  content-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/content-pair.sh

  # A generated site's CMS REST gate (content-api.php) on a real WordPress
  # over HTTP: anonymous Gravity Forms submissions pass while the forms
  # module is active; reading forms, entries or anything else stays 401
  # (gq-platform ADR 0009). Public downloads only; no account.
  cms-rest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/cms-rest-gate.sh

  # A guarded Site's deploy quarantine on a real WordPress (the pinned
  # version, on SQLite, with WP-CLI): the .maintenance file the generated
  # deploy script writes answers every web request 503, WordPress core's
  # fatal-error scrape exception included, while WP-CLI keeps working.
  # Public downloads only; no account.
  quarantine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/quarantine.sh

  # Whether this workflow has the GETQUICK Composer registry's login (the
  # COMPOSER_AUTH secret, an http-basic entry for proxy.composer.getquick.io).
  # Without it cms-resolution is skipped, not passed, and this job warns.
  cms-registry:
    runs-on: ubuntu-latest
    outputs:
      readable: ${{ steps.probe.outputs.readable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - id: probe
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: |
          if scripts/smoke/cms-resolve.sh --probe; then
            echo "readable=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 3 ] || exit "$status"
            echo "readable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=cms-resolution skipped::This workflow has no COMPOSER_AUTH secret with a login for proxy.composer.getquick.io, so neither generated CMS skeleton was resolved against the registry. Only the package suite's offline check of the recorded requirements (blueprint/package-requirements.json) ran. Add the secret to run it."
          fi

  # Both generated CMS skeletons (content and commerce) resolved by Composer
  # against the real GETQUICK registry, each GETQUICK package locked at the
  # blueprint's pin: the pins install together. Runs only with the login.
  cms-resolution:
    needs: cms-registry
    if: needs.cms-registry.outputs.readable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/cms-resolve.sh
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

  # A generated site's consent UI, routes and records (CONSENT-1, LEGAL-1):
  # its Frontend served in workerd with a local D1 publication store and
  # Consent database passes gq-content's shared acceptance suite in Chromium, records
  # decisions, and is ready by gq site check's consent part with GA4 on;
  # monolingual and bilingual. No account.
  consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: scripts/smoke/consent.sh

  # Whether this workflow's token can read the commerce Frontend's private
  # @quick-release packages on GitHub Packages: it reads a package only
  # while that package grants this repository Actions access (an org admin's
  # step in the package's settings). When it can't, generated-commerce is
  # skipped, not passed, and this job warns, naming each package.
  commerce-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      readable: ${{ steps.probe.outputs.readable }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - id: probe
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if scripts/smoke/commerce-check.sh --probe; then
            echo "readable=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            [ "$status" -eq 3 ] || exit "$status"
            echo "readable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=generated-commerce skipped::This workflow's GITHUB_TOKEN can't read the commerce Frontend's @quick-release packages (see the probe's output). Each must grant Quick-Release/gq-site Actions access in its package settings; until then generated-commerce is skipped, not passed."
          fi

  # A disposable commerce site generated by this checkout's gq new
  # (ADR 0017): installed, installed again with a frozen lockfile, in sync,
  # gq verify's checks, its Frontend's build included, and the storefront
  # Runtime mounted, declared by the deploy plan and required by the deploy
  # (#89 slice 6). Runs only while commerce-packages can read the private
  # packages. Not commerce readiness (#26).
  generated-commerce:
    needs: commerce-packages
    if: needs.commerce-packages.outputs.readable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/commerce-check.sh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generated-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/smoke/tanstack-check.mjs
