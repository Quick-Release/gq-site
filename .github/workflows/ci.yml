name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run check

  # A disposable site's Cloudflare CI image, built with Docker: the install
  # step's Composer command as root on a clean CMS, with installer plugins
  # and the dependency patch. Public packages only; no secrets.
  ci-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/ci-composer.sh

  # A disposable site generated by this checkout's gq new: its Frontend's
  # rendered-route tests, astro check, lint and format, against the pinned
  # @getquick/content it installs.
  generated-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/frontend-check.sh

  # A generated site wired to the content package pair (ADR 0020): its pins,
  # the CMS plugin's crontab command and identity (its published ZIP), the
  # migrations the deploy resolves, and its Frontend built by Alchemy's Astro
  # Cloudflare build, served in workerd with a local D1 store, through its
  # /gq routes. No account.
  content-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/content-pair.sh

  # A generated site's consent UI, routes and records (CONSENT-1, LEGAL-1):
  # its Frontend served in workerd with a local D1 publication store and
  # Consent database passes gq-content's shared acceptance suite in Chromium, records
  # decisions, and is ready by gq site check's consent part with GA4 on;
  # monolingual and bilingual. No account.
  consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: scripts/smoke/consent.sh
