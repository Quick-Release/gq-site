name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom
          tools: composer:v2
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run check

  # A disposable site's Cloudflare CI image, built with Docker: the install
  # step's Composer command as root on a clean CMS, with installer plugins
  # and the dependency patch. Public packages only; no secrets.
  ci-composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/ci-composer.sh

  # A disposable site generated by this checkout's gq new: its Frontend's
  # rendered-route and delivery tests, astro check, lint and format.
  generated-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/frontend-check.sh

  # The same site's Frontend built by Alchemy's Astro Cloudflare build and
  # served in workerd with a local D1 store, against a stub CMS: outages,
  # restarts, redeploys, events, withdrawals and reconciliation. No account.
  frontend-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/smoke/frontend-runtime.sh

  generated-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/smoke/tanstack-check.mjs
