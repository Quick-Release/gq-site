packages:
  - "apps/*"
  - "infra"
  - "infra/ci"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  workerd: true
# GETQUICK's own packages may be installed the day they are released:
# @getquick/site, and the consent Runtime it and the Frontend use
# (@getquick/content; the storefront's adapter and GQ Design's npm packages
# on commerce).
minimumReleaseAgeExclude:
  - "@getquick/site"
  - "@getquick/content"
  - "@quick-release/storefront"
  - "@quick-release/design-contract"
  - "@quick-release/design-renderer"
overrides:
  "@effect/platform-node-shared": 4.1.4
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
catalog:
  # Alchemy/Effect: shared by infra (deploy) and apps/frontend (the Vite build
  # resolves the Alchemy server entrypoint from apps/frontend).
  "@alchemy.run/frontend-frameworks": 2.0.0-beta.83
  "@effect/platform-node": 4.1.4
  alchemy: 2.0.0-beta.83
  effect: 4.1.4
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
peerDependencyRules:
  allowedVersions:
    effect: 4.1.4
    vite: 1.6.0
