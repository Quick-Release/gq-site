# This package is the workspace; blueprint templates and fixtures are not packages.
packages:
  - "."

# GETQUICK's consent Runtime, pinned exactly, installs the day it is released.
minimumReleaseAgeExclude:
  - "@getquick/content@0.3.1"
  - "@getquick/content@0.3.2"

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1

# The core alias uses the Vite+ release number rather than Vite's upstream version.
peerDependencyRules:
  allowedVersions:
    vite: 1.0.0
